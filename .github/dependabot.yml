version: 2

# One entry per manifest kind and location this repository actually contains.
# These entries enable and schedule version updates. The groups below carry no
# applies-to, so they cover version updates alone. Security updates are enabled
# in the repository settings, though some options here can still shape their
# pull requests.
updates:
  - package-ecosystem: gomod
    directory: /services/core-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /services/core-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  # The lockfile lives at the workspace root and covers every package in it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # The lint chain cannot load eslint 10 or typescript 7. The Node type lines go
    # for different reasons: 25 is end of life, 26 waits for the coordinated move.
    # Neither expires on its own, and only the 26 line is removed at that move.
    ignore:
      - dependency-name: eslint
        versions:
          - "10.x"
      - dependency-name: typescript
        versions:
          - "7.x"
      - dependency-name: "@types/node"
        versions:
          - "25.x"
          - "26.x"

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-docker-minor-and-patch:
        update-types:
          - minor
          - patch
    # 25 is end of life and must never become the production runtime. 26 is held
    # until the runtime, the image bootstrap and the types move together after it
    # reaches LTS. Neither expires on its own; only the 26 line is removed then.
    ignore:
      - dependency-name: node
        versions:
          - "25.x"
          - "26.x"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
