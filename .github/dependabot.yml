version: 2

# One entry per manifest kind and location this repository actually contains.
# These entries enable and schedule version updates. The groups below carry no
# applies-to, so they cover version updates alone. Security updates are enabled
# in the repository settings, though some options here can still shape their
# pull requests.
updates:
  - package-ecosystem: gomod
    directory: /services/core-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /services/core-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  # The lockfile lives at the workspace root and covers every package in it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # Two majors the installed lint chain cannot load. Each is named on its own,
    # so every other update and every other major still reaches us. The types
    # entry is held until the runtime moves with it, and lifts by hand, not itself.
    ignore:
      - dependency-name: eslint
        versions:
          - "10.x"
      - dependency-name: typescript
        versions:
          - "7.x"
      - dependency-name: "@types/node"
        versions:
          - "26.x"

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-docker-minor-and-patch:
        update-types:
          - minor
          - patch
    # Held until the runtime, the image bootstrap and the types move together,
    # after Node 26 reaches long-term support. Lifting it is a manual step.
    ignore:
      - dependency-name: node
        versions:
          - "26.x"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
