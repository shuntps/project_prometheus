version: 2

# Only the ecosystems actually present in this repository are declared. Security
# updates are a separate mechanism and are not configured here.
updates:
  - package-ecosystem: gomod
    directory: /services/core-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /services/core-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
